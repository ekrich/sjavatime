name: CI
on:
  push:
     branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        java: [ '17', '21', '25' ]
    name: Test using ${{ matrix.os }} and Java ${{ matrix.java }}
    steps:
    - name: Checkout current branch (full)
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # tags for dynver and mima
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'
    - uses: sbt/setup-sbt@v1
    - run: sbt +testFull
    - name: Check binary compatibility (MiMa)
      run: sbt "+sjavatimeJS/mimaReportBinaryIssues; +sjavatimeNative/mimaReportBinaryIssues"
